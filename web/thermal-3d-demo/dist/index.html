<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CoRE Building — Lidar + Thermal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script type="module" crossorigin src="./assets/index-nrt3IK05.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CX_tI9d8.css">
  </head>
  <body>
    <div id="app">
      <canvas id="c"></canvas>

      <header class="top">
        <div>
          <h1>CoRE Building</h1>
          <p class="sub">Rutgers Busch Campus · measured point cloud</p>
        </div>
        <div class="buildings">
          <button type="button" class="active" disabled>CoRE</button>
          <button type="button" class="pending" disabled title="Deferred to a later pass">RWH: pending</button>
        </div>
      </header>

      <aside class="panel">
        <label class="row"><input type="checkbox" id="showLidar" checked /> Lidar geometry</label>
        <label class="row"><input type="checkbox" id="showPhoto" /> UAV dense (registered)</label>
        <label class="row"><input type="checkbox" id="showThermal" checked /> Thermal layer</label>
        <label class="row">Point size <input type="range" id="pointSize" min="1" max="4" step="0.1" value="1.6" /></label>
        <div class="legend">
          <div class="legend-title">Thermal</div>
          <div class="ramp" aria-hidden="true"></div>
          <div class="legend-scale"><span>cooler</span><span>relative intensity</span><span>warmer</span></div>
          <p class="note">Not absolute °C — JPEG IR is relative intensity.</p>
        </div>
      </aside>

      <div class="compass" id="compass" aria-label="North">N</div>
      <div class="scale" id="scale"><i></i><span>50 m</span></div>

      <footer class="prov" id="prov">Loading provenance…</footer>
      <div class="loading" id="loading">Loading point cloud…</div>
    </div>
  </body>
</html>
